# nginx-конфиг для SPA (React Router + Vite build -> dist)
# Назначение: чинит «белый экран» при ПРЯМОМ заходе или обновлении (F5)
# на клиентские маршруты (/profile, /project/:id, /dashboard, /create, /kyc, /voting/...).
#
# Причина бага без этого конфига: nginx ищет физический файл по пути запроса
# (например /profile), не находит и отдаёт 404 -> пустая страница. Нужен fallback
# на index.html, чтобы маршрут разрулил React Router в браузере.
#
# Применение на сервере:
#   1) sudo cp nginx.conf /etc/nginx/conf.d/mileston.conf   (или в sites-available + symlink)
#   2) поправьте root и server_name под свой сервер
#   3) sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;                     # <-- замените на ваш домен, напр. mileston.example.com

    root /var/www/mileston/dist;       # <-- путь к собранному фронту: результат `npm run build`
    index index.html;

    # gzip для статики
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Захэшированные ассеты Vite — отдаём напрямую и кэшируем надолго
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA-fallback: если запрошенного файла нет — отдаём index.html.
    # ИМЕННО ЭТА СТРОКА чинит белый экран на /profile и других маршрутах.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
